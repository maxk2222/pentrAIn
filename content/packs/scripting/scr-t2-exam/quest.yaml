apiVersion: pentrain/v1
kind: Quest
meta:
  id: scr-t2-exam
  track: scripting
  tier: 2
  title: "Exam: Evidence Pipeline"
  version: 1
  exam: true
display:
  tagline: "Tier-2 capstone — script the full pipeline: pull the capture, crack the creds, land the proof, grab the flag."
requirements:
  min_ram_gb: 10
  min_vcpus: 6
  min_disk_gb: 60
  est_deploy_min: 8
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: evidence01
      template: debian-12-x64-server-template
      ram_gb: 2
      cpus: 2
      vlan: 10
      ip_last_octet: 20
      roles: [pentrain_scr_t2_exam]
flags:
  - id: proof-file
    name: "Proof landed — /home/ops-backup/proof.txt"
    kind: command
    points: 200
    command:
      vm: evidence01
      cmd: "test -f /home/ops-backup/proof.txt && grep -q 'analysis-complete' /home/ops-backup/proof.txt"
  - id: loot-flag
    name: "Loot flag — /home/ops-backup/loot.txt"
    kind: file
    points: 200
    vm: evidence01
    file_path: /home/ops-backup/loot.txt
hints:
  - id: h1
    cost: 25
    stage: recon
    text: "The evidence share indexes itself — pull capture.pcap, then read the FTP control channel: USER/PASS are cleartext."
  - id: h2
    cost: 40
    stage: analysis
    text: "tshark -r cap -Y ftp -T fields -e ftp.request.command -e ftp.request.arg, or strings the pcap — the creds pair jumps out."
  - id: h3
    cost: 60
    stage: exploit
    text: "Automate the landing: sshpass -p <pass> ssh ops-backup@<ip> 'echo analysis-complete > proof.txt' — then read loot.txt the same way."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-pcap
      name: "Downloaded the capture"
      detect: { command_match: "(capture\\.pcap|curl.*evidence|wget)" }
      hint_after_s: 600
    - id: cp-creds
      name: "Extracted the credentials"
      detect: { command_match: "(tshark|strings|ftp.request|USER |PASS )" }
      hint_after_s: 480
    - id: cp-land
      name: "Landed the proof file"
      detect: { command_match: "(sshpass|proof\\.txt|ops-backup)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 120, nudge_s: 420, hint_s: 780 }
scoring:
  base: 550
  time_bonus_max: 200
  par_s: 2100
  takeover_cost: 150
