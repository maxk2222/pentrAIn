apiVersion: pentrain/v1
kind: Quest
meta:
  id: scr-t1-bash-recon
  track: scripting
  tier: 1
  title: "Recon.sh"
  version: 1
display:
  tagline: "Your first recon script — probe a fileserver, sift its logs, and make bash produce the report."
requirements:
  min_ram_gb: 10
  min_vcpus: 6
  min_disk_gb: 60
  est_deploy_min: 8
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: filesrv01
      template: debian-12-x64-server-template
      ram_gb: 2
      cpus: 2
      vlan: 10
      ip_last_octet: 20
      roles: [pentrain_scr_t1_bash]
flags:
  - id: recon-script
    name: "recon.sh finds the web service on :8080"
    kind: command
    points: 150
    command:
      vm: kali
      cmd: "test -x /root/recon.sh && timeout 60 /root/recon.sh 2>/dev/null | grep -q 8080"
  - id: attackers-report
    name: "attackers.txt names the brute-forcer"
    kind: command
    points: 150
    command:
      vm: kali
      cmd: "test -f /root/attackers.txt && grep -q 203.0.113.66 /root/attackers.txt"
hints:
  - id: h1
    cost: 25
    stage: recon
    text: "The script lives on your Kali at /root/recon.sh — shebang, chmod +x, then run it. Port-probe with bash's /dev/tcp or nmap."
  - id: h2
    cost: 40
    stage: analysis
    text: "The log is on the target — fetch it or grep it remotely. `grep 'Failed password' auth.log | awk '{print $11}' | sort -u` isolates attacker IPs."
  - id: h3
    cost: 60
    stage: analysis
    text: "scp, ssh with a remote cat, or curl the anonymous ftp — any transport works. Write results to /root/attackers.txt, one IP per line."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-script
      name: "Created an executable recon.sh"
      detect: { command_match: "(recon\\.sh|chmod \\+x)" }
      hint_after_s: 600
    - id: cp-scan
      name: "Probed the target for open ports"
      detect: { command_match: "(nmap|/dev/tcp|ncat|nc )" }
      hint_after_s: 480
    - id: cp-grep
      name: "Extracted attacker IPs from the log"
      detect: { command_match: "(grep.*Failed|awk.*auth\\.log|attackers\\.txt)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 120, nudge_s: 420, hint_s: 780 }
scoring:
  base: 400
  time_bonus_max: 200
  par_s: 1500
  takeover_cost: 150
