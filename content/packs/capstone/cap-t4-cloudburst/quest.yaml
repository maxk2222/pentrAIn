apiVersion: pentrain/v1
kind: Quest
meta:
  id: cap-t4-cloudburst
  track: capstone
  tier: 4
  title: "Cloudburst"
  version: 1
display:
  tagline: "From a public preview feature to the kubernetes node — the full cloud-native kill chain, end to end."
requirements:
  min_ram_gb: 16
  min_vcpus: 10
  min_disk_gb: 110
  est_deploy_min: 20
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: edge01
      template: debian-12-x64-server-template
      ram_gb: 3
      cpus: 2
      vlan: 10
      ip_last_octet: 30
      roles: [pentrain_docker_host, pentrain_cap_t4_edge]
    - name: k8s01
      template: debian-12-x64-server-template
      ram_gb: 5
      cpus: 3
      vlan: 10
      ip_last_octet: 31
      roles: [pentrain_docker_host, pentrain_cloud_t1_k8s]
flags:
  - id: flag-1
    name: "Flag 1"
    kind: file
    points: 150
    vm: edge01
    container: public-web
    file_path: /srv/app/flag.txt
  - id: flag-2
    name: "Flag 2"
    kind: command
    points: 150
    command:
      vm: k8s01
      cmd: "docker exec lab-control-plane sh -c 'CID=$(crictl ps --name shop-app -q | head -1); crictl exec \"$CID\" test -f /tmp/.pwned'"
  - id: flag-3
    name: "Flag 3"
    kind: file
    points: 200
    vm: k8s01
    file_path: /opt/labflags/api-secret.txt
  - id: flag-4
    name: "Flag 4"
    kind: file
    points: 300
    vm: k8s01
    file_path: /root/k8s-flag.txt
  - id: flag-5
    name: "Flag 5"
    kind: command
    points: 200
    command:
      vm: kali
      cmd: "test -f /root/cloudburst-report.txt && grep -qi 'cloudburst' /root/cloudburst-report.txt"
scoring:
  base: 1000
  time_bonus_max: 300
  par_s: 4200
  takeover_cost: 250
