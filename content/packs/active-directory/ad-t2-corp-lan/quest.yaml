apiVersion: pentrain/v1
kind: Quest
meta:
  id: ad-t2-corp-lan
  track: active-directory
  tier: 2
  title: "Lateral Pressure"
  version: 1
display:
  tagline: "A linux file server, a domain-joined workstation, a DC — the creds walk from one to the next."
requirements:
  min_ram_gb: 32
  min_vcpus: 12
  min_disk_gb: 240
  est_deploy_min: 45
  needs_windows: true
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 8
    cpus: 4
  vms:
    - name: files01
      template: debian-12-x64-server-template
      ram_gb: 3
      cpus: 2
      vlan: 10
      ip_last_octet: 52
      roles: [pentrain_ad_t2_files]
    - name: ws01
      template: win11-22h2-x64-template
      ram_gb: 6
      cpus: 4
      vlan: 10
      ip_last_octet: 53
      linux: false
      windows:
        sysprep: true
      domain:
        name: corp.pentrain.local
        member: true
      roles: [pentrain_ad_t2_ws]
    - name: dc01
      template: win2022-server-x64-template
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 51
      linux: false
      windows:
        sysprep: true
      domain:
        name: corp.pentrain.local
      roles: [pentrain_ad_t2_dc]
flags:
  - id: files-flag
    name: "Fileserver flag — the creds stash"
    kind: file
    points: 150
    vm: files01
    file_path: /srv/share/flag.txt
  - id: ws-flag
    name: "Workstation flag — the middle hop"
    kind: file
    points: 250
    vm: ws01
    file_path: "C:\\flags\\workstation.txt"
  - id: dc-flag
    name: "DC flag — domain admin"
    kind: file
    points: 400
    vm: dc01
    file_path: "C:\\flags\\domain-admin.txt"
hints:
  - id: h1
    cost: 40
    stage: recon
    text: "Start at files01 — its SMB share is guest-readable and carries both flag and credentials in a backups folder."
  - id: h2
    cost: 60
    stage: exploit
    text: "The leaked creds log into ws01 (winrm/smb). ws01 is domain-joined — a helpdesk notes file there names the dc admin pattern."
  - id: h3
    cost: 80
    stage: privesc
    text: "From ws01, the domain-admin creds in C:\\ops\\dc-note.txt reach the DC — evil-winrm/psexec as CORP\\Administrator."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-smb
      name: "Browsed the share"
      detect: { command_match: "(smbclient|smbmap|netexec|nxc.*smb)" }
      hint_after_s: 720
    - id: cp-ws
      name: "Reached the workstation"
      detect: { command_match: "(evil-winrm|winrm|psexec|wmiexec|xfreerdp)" }
      hint_after_s: 900
    - id: cp-da
      name: "Domain-admin attempt"
      detect: { command_match: "(Administrator|secretsdump|dcsync|ntds)" }
      hint_after_s: 900
  escalation: { observe_grace_s: 300, nudge_s: 720, hint_s: 1200 }
scoring:
  base: 800
  time_bonus_max: 300
  par_s: 3900
  takeover_cost: 200
