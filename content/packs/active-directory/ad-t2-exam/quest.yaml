apiVersion: pentrain/v1
kind: Quest
meta:
  id: ad-t2-exam
  track: active-directory
  tier: 2
  title: "Exam: The Corp Lan"
  exam: true
  version: 1
display:
  tagline: "T2 final exam: the full corp chain — share loot, workstation pivot, domain roast. One flag per hop, one extra roastable surprise."
requirements:
  min_ram_gb: 30
  min_vcpus: 12
  min_disk_gb: 240
  est_deploy_min: 45
  needs_windows: true
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: files01
      template: debian-12-x64-server-template
      ram_gb: 3
      cpus: 2
      vlan: 10
      ip_last_octet: 52
      roles: [pentrain_ad_t2_files, pentrain_ad_t2_exam_files]
    - name: ws01
      template: win11-22h2-x64-template
      ram_gb: 6
      cpus: 4
      vlan: 10
      ip_last_octet: 53
      linux: false
      windows:
        sysprep: true
      domain:
        fqdn: corp.pentrain.local
        role: member
      roles: [pentrain_ad_t2_ws]
    - name: dc01
      template: win2022-server-x64-template
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 51
      linux: false
      windows:
        sysprep: true
      domain:
        fqdn: corp.pentrain.local
        role: primary-dc
      roles: [pentrain_ad_t2_dc, pentrain_ad_t2_exam_dc]
flags:
  - id: files-flag
    name: "Fileserver flag — the share's stash"
    kind: file
    points: 150
    vm: files01
    file_path: /srv/share/flag.txt
  - id: ws-flag
    name: "Workstation flag — the middle hop"
    kind: file
    points: 200
    vm: ws01
    file_path: "C:\\flags\\workstation.txt"
  - id: roast-flag
    name: "Roast flag — the exam's extra roastable"
    kind: file
    points: 200
    vm: dc01
    file_path: "C:\\flags\\exam\\roast.txt"
  - id: dc-flag
    name: "Domain flag — enterprise admin proof"
    kind: file
    points: 300
    vm: dc01
    file_path: "C:\\flags\\domain-admin.txt"
hints:
  - id: h1
    cost: 50
    stage: recon
    text: "The fileserver's guest share leaks workstation creds AND a maintenance note naming a service account with 'preauth OFF' — remember what that means."
  - id: h2
    cost: 70
    stage: exploit
    text: "ws01 login via the leaked CORP\\wuser creds (netexec or evil-winrm). From there, domain enum reveals what's roastable."
  - id: h3
    cost: 90
    stage: exploit
    text: "svc-metrics needs no preauth: impacket-GetNPUsers -no-pass. svc-backup still has an SPN: GetUserSPNs. Crack both with hashcat 18200/13100."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-share
      name: "Looted the fileserver"
      detect: { command_match: "(smbclient|smbmap|netexec|crackmapexec)" }
      hint_after_s: 600
    - id: cp-ws
      name: "Reached the workstation"
      detect: { command_match: "(evil-winrm|winrm|netexec.*wuser|xfreeRDP)" }
      hint_after_s: 720
    - id: cp-roast
      name: "Roasted a service account"
      detect: { command_match: "(GetUserSPNs|GetNPUsers|kerberoast|asrep)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 120, nudge_s: 480, hint_s: 960 }
scoring:
  base: 850
  time_bonus_max: 300
  par_s: 3600
  takeover_cost: 250
