apiVersion: pentrain/v1
kind: Quest
meta:
  id: ad-t1-exam
  track: active-directory
  tier: 1
  title: "Exam: First Contact"
  exam: true
  version: 1
display:
  tagline: "T1 final exam: enumerate the domain, roast TWO service accounts (one Kerberoast, one AS-REP), and loot SYSVOL on the way."
requirements:
  min_ram_gb: 22
  min_vcpus: 8
  min_disk_gb: 160
  est_deploy_min: 35
  needs_windows: true
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: dc01
      template: win2022-server-x64-template
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 51
      linux: false
      windows:
        sysprep: true
      domain:
        fqdn: corp.pentrain.local
        role: primary-dc
      roles: [pentrain_ad_t1, pentrain_ad_t1_exam]
flags:
  - id: sysvol-flag
    name: "SYSVOL flag — readable by any domain user"
    kind: file
    points: 150
    vm: dc01
    file_path: "C:\\Windows\\SYSVOL\\domain\\scripts\\flag.txt"
  - id: roast-flag
    name: "Roast flag — crack either service account"
    kind: file
    points: 200
    vm: dc01
    file_path: "C:\\flags\\exam\\roast.txt"
  - id: dc-flag
    name: "Domain flag — domain admin proof"
    kind: file
    points: 300
    vm: dc01
    file_path: "C:\\flags\\domain-admin.txt"
hints:
  - id: h1
    cost: 40
    stage: recon
    text: "Full AD enum first: netexec smb <dc01> --shares, enum4linux-ng, ldapsearch. SYSVOL is world-readable for domain users — check scripts/."
  - id: h2
    cost: 60
    stage: exploit
    text: "Two roasts, two primitives: impacket-GetUserSPNs for the SPN account, impacket-GetNPUsers -no-pass -usersfile users.txt for the no-preauth one."
  - id: h3
    cost: 80
    stage: exploit
    text: "hashcat -m 18200 (AS-REP) and -m 13100 (TGS) with rockyou. The DA account reaches C:\\flags; the AS-REP account's loot channel is an SMB share that only it can read — enumerate shares as that user."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-enum
      name: "Enumerated the domain"
      detect: { command_match: "(netexec|crackmapexec|enum4linux|ldapsearch|bloodhound|smbclient)" }
      hint_after_s: 720
    - id: cp-roast
      name: "Roasted an account"
      detect: { command_match: "(GetUserSPNs|GetNPUsers|kerberoast|asrep|Rubeus)" }
      hint_after_s: 600
    - id: cp-crack
      name: "Cracked a hash"
      detect: { command_match: "(hashcat|john)" }
      hint_after_s: 720
  escalation: { observe_grace_s: 120, nudge_s: 480, hint_s: 900 }
scoring:
  base: 650
  time_bonus_max: 250
  par_s: 2700
  takeover_cost: 200
