apiVersion: pentrain/v1
kind: Quest
meta:
  id: ad-t1-first-domain
  track: active-directory
  tier: 1
  title: "Domain Join"
  version: 1
display:
  tagline: "One domain controller, one roastable service account — your first AS-REP/Kerberoast win."
requirements:
  min_ram_gb: 24
  min_vcpus: 8
  min_disk_gb: 160
  est_deploy_min: 35
  needs_windows: true
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 8
    cpus: 4
  vms:
    - name: dc01
      template: win2022-server-x64-template
      ram_gb: 8
      cpus: 4
      vlan: 10
      ip_last_octet: 51
      linux: false
      windows:
        sysprep: true
      domain:
        fqdn: corp.pentrain.local
        role: primary-dc
      roles: [pentrain_ad_t1]
flags:
  - id: dc-flag
    name: "Domain flag — on the DC, requires the cracked service account"
    kind: file
    points: 300
    vm: dc01
    file_path: "C:\\flags\\domain-admin.txt"
  - id: sysvol-flag
    name: "SYSVOL flag — a script dir readable by any domain user"
    kind: file
    points: 150
    vm: dc01
    file_path: "C:\\Windows\\SYSVOL\\domain\\scripts\\flag.txt"
hints:
  - id: h1
    cost: 40
    stage: recon
    text: "Enumerate AD first: nmap -p 88,135,389,445,636 <dc01>. Users/services are the objective — enum4linux-ng or netexec give the lay of the land."
  - id: h2
    cost: 60
    stage: exploit
    text: "svc-backup has an SPN and a weak password — kerberoast it (impacket-GetUserSPNs or Rubeus), crack with hashcat mode 13100."
  - id: h3
    cost: 80
    stage: exploit
    text: "Once cracked: the account is domain-admin-equivalent here — psexec/evil-winrm to the DC, flags at C:\\flags\\ and SYSVOL scripts dir."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-adenum
      name: "Enumerated AD services"
      detect: { command_match: "(enum4linux|netexec|nxc|ldapsearch|nmap.*(88|389|445))" }
      hint_after_s: 720
    - id: cp-roast
      name: "Requested the roastable ticket"
      detect: { command_match: "(GetUserSPNs|GetNPUsers|kerbrute|Rubeus|reus|impacket)" }
      hint_after_s: 900
    - id: cp-crack
      name: "Cracked the ticket"
      detect: { command_match: "(hashcat|john)" }
      hint_after_s: 900
  escalation: { observe_grace_s: 300, nudge_s: 720, hint_s: 1200 }
scoring:
  base: 700
  time_bonus_max: 300
  par_s: 3300
  takeover_cost: 200
