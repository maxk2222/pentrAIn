apiVersion: pentrain/v1
kind: Quest
meta:
  id: cloud-t2-metadata-review
  track: cloud-native
  tier: 2
  title: "Metadata Boundary"
  version: 1
display:
  tagline: "Review synthetic cloud metadata and workload identity evidence without contacting a cloud."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_cloud_metadata_audit]
flags:
  - id: metadata-review
    name: "Submit a workload metadata and identity assessment"
    kind: command
    points: 350
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/metadata-boundary.md && grep -qi 'metadata' /tmp/pentrain-audit-reports/metadata-boundary.md && grep -qi 'identity' /tmp/pentrain-audit-reports/metadata-boundary.md"
hints:
  - id: h1
    cost: 30
    stage: recon
    text: "Read the synthetic architecture and incident record; no cloud endpoint is available."
  - id: h2
    cost: 55
    stage: analysis
    text: "Compare the worker's required destinations and storage scope with its actual identity and egress."
  - id: h3
    cost: 80
    stage: post
    text: "Recommend scoped identity, restricted egress and a synthetic denied-access test."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-cloud
      name: "Reviewed metadata and workload permissions"
      detect: { command_match: "(metadata-review|link.local|storage|identity)" }
      hint_after_s: 720
  escalation: { observe_grace_s: 180, nudge_s: 540, hint_s: 960 }
scoring:
  base: 350
  time_bonus_max: 120
  par_s: 1500
  takeover_cost: 120
