apiVersion: pentrain/v1
kind: Quest
meta:
  id: cloud-t3-exam
  track: cloud-native
  tier: 3
  title: "Exam: Platform Assurance"
  exam: true
  version: 1
display:
  tagline: "Correlate workload identity, metadata exposure and production reconciliation evidence."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_cloud_t3_exam]
flags:
  - id: platform-assurance-report
    name: "Submit the platform assurance report"
    kind: command
    points: 600
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/platform-assurance.md && grep -qi 'identity' /tmp/pentrain-audit-reports/platform-assurance.md && grep -qi 'provenance' /tmp/pentrain-audit-reports/platform-assurance.md"
hints: []
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-review
      name: "Correlated platform assurance evidence"
      detect: { command_match: "(cloud-t3-exam|metadata|reconciler|provenance|namespace)" }
      hint_after_s: 1500
  escalation: { observe_grace_s: 300, nudge_s: 1080, hint_s: 1800 }
scoring:
  base: 600
  time_bonus_max: 200
  par_s: 2700
  takeover_cost: 180
