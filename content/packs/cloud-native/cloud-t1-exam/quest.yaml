apiVersion: pentrain/v1
kind: Quest
meta:
  id: cloud-t1-exam
  track: cloud-native
  tier: 1
  title: "Exam: Production Boundary"
  exam: true
  version: 1
display:
  tagline: "Produce a complete review of workload permissions and release provenance."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_cloud_exam]
flags:
  - id: cloud-exam-report
    name: "Submit the production-boundary assessment"
    kind: command
    points: 450
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/cloud-exam.md && grep -qi 'rbac' /tmp/pentrain-audit-reports/cloud-exam.md && grep -qi 'provenance' /tmp/pentrain-audit-reports/cloud-exam.md"
hints: []
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-evidence
      name: "Reviewed the workload and delivery evidence"
      detect: { command_match: "(rbac-review|gitops-review|provenance|runner)" }
      hint_after_s: 900
  escalation: { observe_grace_s: 240, nudge_s: 720, hint_s: 1200 }
scoring:
  base: 450
  time_bonus_max: 150
  par_s: 2100
  takeover_cost: 100
