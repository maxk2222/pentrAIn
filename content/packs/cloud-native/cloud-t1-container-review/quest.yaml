apiVersion: pentrain/v1
kind: Quest
meta:
  id: cloud-t1-container-review
  track: cloud-native
  tier: 1
  title: "Runtime Socket Exception"
  version: 1
display:
  tagline: "Assess a container runtime socket mount and host filesystem access from deployment evidence."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_cloud_socket_audit]
flags:
  - id: runtime-boundary-report
    name: "Submit the container runtime boundary assessment"
    kind: command
    points: 300
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/runtime-boundary.md && grep -qi 'socket' /tmp/pentrain-audit-reports/runtime-boundary.md && grep -qi 'least.privilege' /tmp/pentrain-audit-reports/runtime-boundary.md"
hints:
  - id: h1
    cost: 25
    stage: recon
    text: "Read the deployment record and compare the sidecar's need with the mounts it receives."
  - id: h2
    cost: 50
    stage: analysis
    text: "Assess the authority represented by the runtime control socket and the host filesystem mount."
  - id: h3
    cost: 75
    stage: post
    text: "Recommend removing unnecessary host control access and verifying only health metrics remain available."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-mounts
      name: "Reviewed container mounts and service need"
      detect: { command_match: "(container-socket-review|runtime socket|sidecar|mount)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 180, nudge_s: 480, hint_s: 900 }
scoring:
  base: 300
  time_bonus_max: 100
  par_s: 1200
  takeover_cost: 100
