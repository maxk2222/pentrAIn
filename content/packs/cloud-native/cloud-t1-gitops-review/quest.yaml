apiVersion: pentrain/v1
kind: Quest
meta:
  id: cloud-t1-gitops-review
  track: cloud-native
  tier: 1
  title: "Release Gate"
  version: 1
display:
  tagline: "Trace a GitOps release chain and identify where untrusted changes can gain production authority."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_cloud_gitops_audit]
flags:
  - id: gitops-review
    name: "Submit a production release trust-boundary review"
    kind: command
    points: 300
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/gitops-review.md && grep -qi 'runner' /tmp/pentrain-audit-reports/gitops-review.md && grep -qi 'artifact' /tmp/pentrain-audit-reports/gitops-review.md"
hints:
  - id: h1
    cost: 25
    stage: recon
    text: "Read the local release workflow and trace which identity and artifact each stage uses."
  - id: h2
    cost: 50
    stage: analysis
    text: "Focus on fork contributions, persistent workers, secret availability and mutable image references."
  - id: h3
    cost: 75
    stage: post
    text: "Write a report that separates build from deploy authority and proposes reviewed, immutable, verified artifacts."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-workflow
      name: "Traced the build and deploy trust boundaries"
      detect: { command_match: "(gitops-review|branches:|RELEASE_TOKEN|runner|artifact)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 180, nudge_s: 480, hint_s: 900 }
scoring:
  base: 300
  time_bonus_max: 100
  par_s: 1200
  takeover_cost: 100
