apiVersion: pentrain/v1
kind: Quest
meta:
  id: linux-t2-exam
  track: linux-fundamentals
  tier: 2
  title: "Exam: The Maintenance Window"
  exam: true
  version: 1
display:
  tagline: "T2 final exam: loot → shell → root. Two escalation paths are open — a scoped sudo and a trusting cron. Find at least one."
requirements:
  min_ram_gb: 10
  min_vcpus: 6
  min_disk_gb: 80
  est_deploy_min: 8
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: maint01
      template: debian-12-x64-server-template
      ram_gb: 2
      cpus: 2
      vlan: 10
      ip_last_octet: 44
      roles: [pentrain_linux_t2_exam]
flags:
  - id: user-flag
    name: "User flag — /home/maint/user.txt"
    kind: file
    points: 150
    vm: maint01
    file_path: /home/maint/user.txt
  - id: root-flag
    name: "Root flag — /root/root.txt"
    kind: file
    points: 350
    vm: maint01
    file_path: /root/root.txt
hints:
  - id: h1
    cost: 30
    stage: recon
    text: "The box announces itself — the login banner/motd is world-readable even before you have a shell. nmap, then read what SSH shows."
  - id: h2
    cost: 50
    stage: privesc
    text: "Two independent paths: `sudo -l` shows a scoped binary (GTFOBins), and /etc/cron.d holds a root job operating on YOUR files."
  - id: h3
    cost: 70
    stage: privesc
    text: "journalctl: `sudo journalctl` then `!/bin/sh` inside the pager. Cron: files named --checkpoint=1 and --checkpoint-action=exec=... in the spool."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-ssh
      name: "Logged in as maint"
      detect: { command_match: "ssh .*maint" }
      hint_after_s: 600
    - id: cp-sudo
      name: "Enumerated privilege paths"
      detect: { command_match: "(sudo -l|/etc/cron|crontab|list-timers)" }
      hint_after_s: 480
    - id: cp-exec
      name: "Triggered an escalation"
      detect: { command_match: "(journalctl|checkpoint|exec=sh|!/bin)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 120, nudge_s: 480, hint_s: 840 }
scoring:
  base: 500
  time_bonus_max: 200
  par_s: 1500
  takeover_cost: 150
