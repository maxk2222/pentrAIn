apiVersion: pentrain/v1
kind: Quest
meta:
  id: linux-t3-capability-review
  track: linux-fundamentals
  tier: 3
  title: "Permission Baseline"
  version: 1
display:
  tagline: "Audit a service's Linux capability inventory against its documented access needs."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_linux_capability_audit]
flags:
  - id: capability-review
    name: "Submit a least-privilege service permission review"
    kind: command
    points: 300
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/capability-review.md && grep -qi 'capability' /tmp/pentrain-audit-reports/capability-review.md && grep -qi 'baseline' /tmp/pentrain-audit-reports/capability-review.md"
hints:
  - id: h1
    cost: 25
    stage: recon
    text: "Read the authorized permission inventory and the documented service behavior."
  - id: h2
    cost: 50
    stage: analysis
    text: "Compare the listed privileges with the service's documented file access needs."
  - id: h3
    cost: 75
    stage: post
    text: "Recommend removing unnecessary privileges and describe a safe denied-access verification."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-inventory
      name: "Compared privileges with the service baseline"
      detect: { command_match: "(capability-review|cap_setuid|cap_sys_admin|baseline)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 180, nudge_s: 480, hint_s: 900 }
scoring:
  base: 300
  time_bonus_max: 100
  par_s: 1200
  takeover_cost: 100
