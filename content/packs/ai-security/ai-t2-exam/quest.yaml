apiVersion: pentrain/v1
kind: Quest
meta:
  id: ai-t2-exam
  track: ai-security
  tier: 2
  title: "Exam: Model Operations"
  exam: true
  version: 1
display:
  tagline: "Deliver a combined assessment of AI tool governance and model artifact provenance."
requirements:
  min_ram_gb: 8
  min_vcpus: 5
  min_disk_gb: 60
  est_deploy_min: 6
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    ram_min_gb: 3
    cpus: 4
    roles: [pentrain_ai_t2_exam]
flags:
  - id: model-operations-exam
    name: "Submit the model operations security assessment"
    kind: command
    points: 500
    command:
      vm: kali
      cmd: "test -s /tmp/pentrain-audit-reports/model-operations-exam.md && grep -qi 'tool' /tmp/pentrain-audit-reports/model-operations-exam.md && grep -qi 'provenance' /tmp/pentrain-audit-reports/model-operations-exam.md"
hints: []
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-evidence
      name: "Correlated the tool and artifact evidence"
      detect: { command_match: "(mcp-review|model-registry-review|provenance|publisher)" }
      hint_after_s: 1200
  escalation: { observe_grace_s: 240, nudge_s: 900, hint_s: 1500 }
scoring:
  base: 500
  time_bonus_max: 180
  par_s: 2400
  takeover_cost: 150
