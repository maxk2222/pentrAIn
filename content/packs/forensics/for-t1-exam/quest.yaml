apiVersion: pentrain/v1
kind: Quest
meta:
  id: for-t1-exam
  track: forensics
  tier: 1
  title: "Exam: Black Box"
  exam: true
  version: 1
display:
  tagline: "T1 final exam: one capture, one compromised host. Read the wire, find the trail, prove the persistence."
requirements:
  min_ram_gb: 10
  min_vcpus: 6
  min_disk_gb: 80
  est_deploy_min: 8
topology:
  kali:
    template: kali-x64-desktop-template
    ram_gb: 6
    cpus: 4
  vms:
    - name: archive01
      template: debian-12-x64-server-template
      ram_gb: 2
      cpus: 2
      vlan: 10
      ip_last_octet: 42
      roles: [pentrain_for_t1_exam]
flags:
  - id: stash-flag
    name: "Stash flag — the attacker's cache, found via the history trail"
    kind: file
    points: 150
    vm: archive01
    file_path: /var/tmp/.apt-cache/flag.txt
  - id: user-flag
    name: "User flag — /home/nightops/user.txt"
    kind: file
    points: 150
    vm: archive01
    file_path: /home/nightops/user.txt
  - id: persistence-flag
    name: "Persistence flag — inside the planted watcher directory"
    kind: file
    points: 200
    vm: archive01
    file_path: /var/lib/.fonts-cache/flag.txt
  - id: report-flag
    name: "IR report — /home/analyst/report.txt proves the timeline"
    kind: command
    points: 100
    command:
      vm: archive01
      cmd: "test -f /home/analyst/report.txt && grep -qiE 'nightops' /home/analyst/report.txt && grep -qiE 'fonts-cache' /home/analyst/report.txt"

hints:
  - id: h1
    cost: 30
    stage: recon
    text: "Start with /var/evidence/evidence.pcap — tshark -r or Wireshark. One protocol is cleartext and carries both credentials and a directory name."
  - id: h2
    cost: 50
    stage: exploit
    text: "The capture says the same password works over SSH. Once in as nightops, bash_history knows where the stash is."
  - id: h3
    cost: 60
    stage: persistence
    text: "The memo names the watcher: /var/lib/.fonts-cache/. systemd-analyze list-units or ls /etc/systemd/system confirm the service."
coach:
  briefing_ref: coach_context.md
  checkpoints:
    - id: cp-pcap
      name: "Opened the capture"
      detect: { command_match: "(tshark|wireshark|tcpdump|capinfos|evidence\\.pcap)" }
      hint_after_s: 480
    - id: cp-ssh
      name: "Used the captured creds"
      detect: { command_match: "ssh .*nightops" }
      hint_after_s: 600
    - id: cp-persist
      name: "Found the persistence unit"
      detect: { command_match: "(fonts-cache|persist\\.sh|systemctl|systemd/system)" }
      hint_after_s: 600
  escalation: { observe_grace_s: 120, nudge_s: 420, hint_s: 720 }
scoring:
  base: 500
  time_bonus_max: 200
  par_s: 1500
  takeover_cost: 150
