apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-sa
  namespace: shop
---
# the training misconfig: a shop-namespaced SA holding prod privileges —
# secrets read + pod create + pod log read in the prod namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-reader
  namespace: prod
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-sa-prod
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: shop-sa
    namespace: shop
roleRef:
  kind: Role
  name: prod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: app-config
  namespace: prod
stringData:
  db-password: "pr0d-rotat3-m3"
  note: "node secrets stay on the node — /root/k8s-flag.txt"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-app
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-app}
  template:
    metadata:
      labels: {app: shop-app}
    spec:
      serviceAccountName: shop-sa
      containers:
        - name: shop-app
          image: pentrain/shop-app:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          volumeMounts:
            - name: labflags
              mountPath: /etc/labflags
              readOnly: true
      volumes:
        - name: labflags
          hostPath:
            path: /mnt/labflags   # the kind node's mount of app01 /opt/labflags
---
apiVersion: v1
kind: Service
metadata:
  name: shop-app
  namespace: shop
spec:
  type: NodePort
  selector: {app: shop-app}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
