kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    extraMounts:
      # app01's injected flag bundle -> visible inside the kind node
      - hostPath: /opt/labflags
        containerPath: /mnt/labflags
      # the whole node root — this is what the privileged pod escapes into
      - hostPath: /
        containerPath: /host
        readOnly: true
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
