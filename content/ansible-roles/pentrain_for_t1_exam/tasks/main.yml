---
# for-t1-exam "Black Box" — combines for-t1-break-in (logs → history trail →
# persistence) + for-t1-wiretap (pcap creds → ssh). The planted evidence.pcap
# leaks nightops/NightShift9! and names the persistence dir; the host holds
# the matching artifacts.

- name: ensure openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: IR analyst account (briefing-documented; fetches the evidence)
  ansible.builtin.user:
    name: analyst
    password: "{{ 'analysis' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/analyst
    create_home: true

- name: nightops — the account whose creds fly through the capture
  ansible.builtin.user:
    name: nightops
    password: "{{ 'NightShift9!' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/nightops
    create_home: true

- name: evidence drop — the capture the trainee must read first
  ansible.builtin.file:
    path: /var/evidence
    state: directory
    mode: "0755"

- name: plant the capture (generated by scripts/make_capture_pcap.py blackbox)
  ansible.builtin.copy:
    src: evidence.pcap
    dest: /var/evidence/evidence.pcap
    mode: "0644"

- name: attacker stash dir (bash_history points here)
  ansible.builtin.file:
    path: /var/tmp/.apt-cache
    state: directory
    owner: nightops
    group: nightops
    mode: "0700"

- name: persistence dir named in the pcap memo
  ansible.builtin.file:
    path: /var/lib/.fonts-cache
    state: directory
    owner: nightops
    group: nightops
    mode: "0700"

- name: fake persistence script (matches the capture)
  ansible.builtin.copy:
    dest: /var/lib/.fonts-cache/persist.sh
    content: |
      #!/bin/sh
      # fonts-cache helper — do not remove
      while true; do sleep 3600; done
    mode: "0755"

- name: fake service unit completing the persistence story
  ansible.builtin.copy:
    dest: /etc/systemd/system/fonts-cache.service
    content: |
      [Unit]
      Description=Font cache maintenance
      [Service]
      ExecStart=/var/lib/.fonts-cache/persist.sh
      Restart=always
      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: seeded bash_history — the trail to the stash
  ansible.builtin.copy:
    dest: /home/nightops/.bash_history
    content: |
      cd /var/tmp/.apt-cache
      ls -la
      cat notes.txt
      cp flag.txt /var/tmp/.apt-cache/ 2>/dev/null || true
      history -c
    owner: nightops
    group: nightops
    mode: "0600"

- name: decoy note in the stash
  ansible.builtin.copy:
    dest: /var/tmp/.apt-cache/notes.txt
    content: "stage complete — persist via fonts-cache.service, wipe when done\n"
    mode: "0644"

- name: ssh password auth on
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: restart sshd

- name: sshd_config.d drop-in wins over cloud-image defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-pentrain-password.conf
    content: "PasswordAuthentication yes\n"
    mode: "0644"
  notify: restart sshd
