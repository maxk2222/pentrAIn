---
# cap-t2-nordmarkt shop01 — a small retailer's everything-box. Three docker
# containers on two pinned bridge nets: web serves :80 and leaks a backup
# tarball (ssh creds + api token); api lives only on the internal shopapp
# net, runs a command-injectable export endpoint, and its config holds the
# read-only DB creds; db grants FILE so LOAD_FILE reads the loot file.
# A root-run cron script is group-writable by deploy — the privesc.
# Flags are injected post-deploy via guest-agent + docker exec.

- name: packages (mariadb-client for the data-tier hop)
  ansible.builtin.apt:
    name: [mariadb-client, tar, curl, cron, openssh-server]
    state: present
    update_cache: true

- name: deploy account — the password sits in the backup tarball on the shop site
  ansible.builtin.user:
    name: deploy
    password: "{{ 'Nordm#arkt!25' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/deploy
    create_home: true

- name: ssh password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: restart sshd

- name: sshd_config.d drop-in wins over cloud-image defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-pentrain-password.conf
    content: "PasswordAuthentication yes\n"
    mode: "0644"
  notify: restart sshd

- name: deploy's scratchpad — names the internal tiers (findable anyway via /proc/net)
  ansible.builtin.copy:
    dest: /home/deploy/ops-todo.txt
    content: |
      ops todo — shop box

      - order-api runs INTERNAL only on the app bridge (172.20.1.2:8080).
        token is in the deploy-config tarball — do NOT republish the port,
        last time it was open to the world for a week.
      - db sits next to it (172.20.1.3). shop_ro is the read-only login,
        migration leftovers still in the vault table.
      - backup.sh stays editable for the deploy group — kirsten runs it on
        a tight cron schedule until marketing signs off. do NOT change the
        schedule, she'll notice within minutes.
    owner: deploy
    group: deploy
    mode: "0600"

- name: shop site tree (docroot of the web container)
  ansible.builtin.copy:
    src: site/
    dest: /opt/shop/site
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: backup tarball — config.env only ships inside the archive
  ansible.builtin.command:
    cmd: tar czf /opt/shop/site/backups/shop-backup.tar.gz -C /opt/shop/site/backups config.env orders-2024.csv deploy-notes.txt
    creates: /opt/shop/site/backups/shop-backup.tar.gz

- name: drop the loose secret — it only exists inside the archive
  ansible.builtin.file:
    path: /opt/shop/site/backups/config.env
    state: absent

- name: nginx site config for the web container (autoindex leaks the listing)
  ansible.builtin.copy:
    src: nginx-shop.conf
    dest: /opt/shop/nginx-shop.conf
    mode: "0644"

- name: api build context
  ansible.builtin.copy:
    src: api/
    dest: /opt/shop/api
    mode: "0644"
    directory_mode: "0755"

- name: db init script
  ansible.builtin.copy:
    src: db/
    dest: /opt/shop/db
    mode: "0644"
    directory_mode: "0755"

# deploy can list /opt/shop but must NOT read the api/db build trees off
# disk — the creds path runs through the api RCE, not around it. dockerd
# builds and mounts them as root either way.
- name: internal build trees off-limits to deploy
  ansible.builtin.file:
    path: "/opt/shop/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: [api, db]

- name: bridge nets — pinned subnets keep api/db addresses deterministic
  ansible.builtin.shell: |
    docker network inspect {{ item.name }} >/dev/null 2>&1 || \
    docker network create --subnet {{ item.subnet }} {{ item.name }} >/dev/null
  loop:
    - {name: shopfront, subnet: "172.20.0.0/24"}
    - {name: shopapp, subnet: "172.20.1.0/24"}
  changed_when: false

# Deploy-time WAN pull — same convention as pentrain_dvwa. Retried: a flaky
# registry fetch shouldn't sink the whole range build.
- name: pull base images
  ansible.builtin.command: "docker pull {{ item }}"
  loop: ["nginx:1.27-alpine", "python:3.12-slim", "mariadb:11.4"]
  register: pull
  retries: 3
  delay: 10
  until: pull.rc == 0
  changed_when: "'Downloaded newer' in pull.stdout or 'Status: Downloaded' in pull.stdout"

- name: build the order-api image
  ansible.builtin.command: docker build -q -t nordmarkt-api /opt/shop/api
  register: apibuild
  changed_when: true

- name: web container — the only published port
  ansible.builtin.command: >-
    docker run -d --name web --restart unless-stopped
    --network shopfront -p 80:80
    -v /opt/shop/site:/usr/share/nginx/html:ro
    -v /opt/shop/nginx-shop.conf:/etc/nginx/conf.d/default.conf:ro
    nginx:1.27-alpine
  register: ctr
  changed_when: ctr.rc == 0
  failed_when: ctr.rc != 0 and 'Conflict' not in (ctr.stderr | default(''))

- name: api container — internal bridge only, nothing published
  ansible.builtin.command: >-
    docker run -d --name api --restart unless-stopped
    --network shopapp --ip 172.20.1.2
    -e API_TOKEN=nm-api-9f3d77c1 -e DB_HOST=172.20.1.3
    nordmarkt-api
  register: ctr
  changed_when: ctr.rc == 0
  failed_when: ctr.rc != 0 and 'Conflict' not in (ctr.stderr | default(''))

# --secure-file-priv= keeps LOAD_FILE unrestricted — deliberate lab misconfig
# alongside the FILE grant in init.sql.
- name: db container
  ansible.builtin.command: >-
    docker run -d --name db --restart unless-stopped
    --network shopapp --ip 172.20.1.3
    -e MARIADB_ROOT_PASSWORD=NmRoot#25
    -e MARIADB_DATABASE=shop
    -v /opt/shop/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mariadb:11.4 --secure-file-priv=
  register: ctr
  changed_when: ctr.rc == 0
  failed_when: ctr.rc != 0 and 'Conflict' not in (ctr.stderr | default(''))

- name: wait for the shop site
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
  register: web_up
  retries: 30
  delay: 3
  until: web_up.status == 200

- name: wait for the order-api
  ansible.builtin.command:
    cmd: docker exec api python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=2)"
  register: api_up
  retries: 30
  delay: 2
  until: api_up.rc == 0
  changed_when: false

- name: wait for mariadb init
  ansible.builtin.command:
    cmd: docker exec db sh -c 'mariadb-admin -uroot -p"$MARIADB_ROOT_PASSWORD" ping --silent'
  register: db_up
  retries: 40
  delay: 3
  until: db_up.rc == 0
  changed_when: false

- name: flag staging dirs inside containers (backend fills them per-session)
  ansible.builtin.command: "docker exec {{ item.c }} mkdir -p {{ item.d }}"
  loop:
    - {c: api, d: /app/data}
    - {c: db, d: /srv/loot}
  changed_when: false

# The cron archives contain db/init.sql (db creds) — root's private store,
# not a second leak path for deploy.
- name: backup output dir — root-only, the archives carry db/ content
  ansible.builtin.file:
    path: /var/backups/shop
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: backup script — root runs it via cron, deploy group can edit it (the privesc)
  ansible.builtin.copy:
    src: backup.sh
    dest: /opt/shop/backup.sh
    owner: root
    group: deploy
    mode: "0775"

- name: cron — root runs the backup every 2 minutes
  ansible.builtin.copy:
    src: shop-backup
    dest: /etc/cron.d/shop-backup
    owner: root
    group: root
    mode: "0644"

- name: cron running
  ansible.builtin.service:
    name: cron
    enabled: true
    state: started
