---
# ad-t3 ws01 — first foothold: local admin + readme leak pointing at ws02.
- name: flag + ops dirs
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop: ["C:\\flags", "C:\\ops"]

- name: local admin account (weak — readme leaks it)
  ansible.windows.win_user:
    name: wadmin
    password: "WAdmin2024!"
    state: present
    groups: Administrators

- name: readme — leaks ws01's own admin AND ws02's (password reuse)
  ansible.windows.win_copy:
    dest: C:\ops\readme.txt
    content: |
      ws fleet local admin (ws01 + ws02 — same for all):
        wadmin / WAdmin2024!
      ws02 helpdesk scripts under C:\helpdesk\.

# anonymous-read share — the misconfiguration that is the intended entry.
# (null-session access needs all four knobs: share acl, ntfs acl,
#  RestrictNullSessAccess=0, NullSessionShares entry)

- name: Everyone can read the ops dir (ntfs)
  ansible.windows.win_acl:
    path: C:\ops
    user: Everyone
    rights: ReadAndExecute
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None

- name: ops share — readable by Everyone (the leak)
  community.windows.win_share:
    name: ops
    path: C:\ops
    list: "yes"
    read: Everyone

- name: allow anonymous session access to shares
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: RestrictNullSessAccess
    data: 0
    type: dword

- name: treat anonymous as Everyone
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: everyoneincludesanonymous
    data: 1
    type: dword

- name: whitelist the ops share for null sessions
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: NullSessionShares
    data: ["ops"]
    type: multistring
