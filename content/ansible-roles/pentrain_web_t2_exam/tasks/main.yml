---
# web-t2-exam "The Intranet" — combines web-t2-juice-shop (SQLi against a
# login) + web-t2-upload-bypass (blacklist upload → .phtml webshell).
# Apache + mod_php: .phtml executes because apache2.conf maps it to php.

- name: packages
  ansible.builtin.apt:
    name: [apache2, php, libapache2-mod-php, php-sqlite3, sqlite3]
    state: present
    update_cache: true

- name: app + data + uploads dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: [/var/www/html, /var/www/html/uploads, /var/lib/intranet]

- name: intranet app files
  ansible.builtin.copy:
    src: "intranet/{{ item }}"
    dest: "/var/www/html/{{ item }}"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: [index.php, upload.php]

- name: php executes .phtml/.phar regardless of distro defaults
  ansible.builtin.copy:
    dest: /etc/apache2/conf-available/pentrain-upload.conf
    content: |
      <FilesMatch ".+\.ph(p[3457]?|tml|ar)$">
          SetHandler application/x-httpd-php
      </FilesMatch>
    mode: "0644"
  notify: restart apache

- name: enable the conf
  ansible.builtin.command: a2enconf pentrain-upload
  changed_when: false
  notify: restart apache

- name: remove the default apache page (docroot is /var/www/html already)
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

- name: sqlite user store
  ansible.builtin.command: >-
    sqlite3 /var/lib/intranet/app.db
    "CREATE TABLE IF NOT EXISTS users(id INTEGER PRIMARY KEY, username TEXT,
      password TEXT, role TEXT);
     INSERT INTO users(username,password,role) SELECT 'hr-admin','Hr!2024x','admin'
       WHERE NOT EXISTS (SELECT 1 FROM users WHERE username='hr-admin');"
  args:
    creates: /var/lib/intranet/app.db

- name: uploads dir writable by apache
  ansible.builtin.file:
    path: /var/www/html/uploads
    owner: www-data
    group: www-data
    mode: "0775"
