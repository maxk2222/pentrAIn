---
# linux-t1-exam "The Onboarding Box" — combines first-foothold (loot → creds
# → ssh) + suid-hunt (SUID binary → root). Welcome note leaks the password;
# /usr/bin/base64 carries the SUID bit (GTFOBins file-read primitive).

- name: ensure openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: intern account (password leaked in the welcome pack)
  ansible.builtin.user:
    name: intern
    password: "{{ 'Intern2024!' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/intern
    create_home: true

- name: onboarding welcome pack — readable by anyone who looks
  ansible.builtin.file:
    path: /opt/onboarding
    state: directory
    mode: "0755"

- name: welcome note with the credentials (the foothold)
  ansible.builtin.copy:
    dest: /opt/onboarding/welcome.txt
    content: |
      Welcome to the team, intern!
      Your workstation account is already set up:
        user: intern
        pass: Intern2024!
      Please change this password on first login. (nobody ever does)
      — IT
    mode: "0644"

# anonymous ftp serves the same onboarding pack — reachable from kali with
# zero credentials (ftp anonymous@<host>, get welcome.txt)
- name: anonymous ftp for the onboarding pack
  ansible.builtin.apt:
    name: vsftpd
    state: present
    update_cache: true

- name: vsftpd — anonymous read-only rooted at /opt/onboarding
  ansible.builtin.copy:
    dest: /etc/vsftpd.conf
    content: |
      listen=YES
      listen_ipv6=NO
      anonymous_enable=YES
      no_anon_password=YES
      anon_root=/opt/onboarding
      anon_upload_enable=NO
      local_enable=NO
      write_enable=NO
      seccomp_sandbox=NO
    mode: "0644"
  notify: restart vsftpd

# /usr/bin/python3 is a symlink to python3.x — chmod resolves it so the real
# ELF ends up SUID (an interpreter = full root shell via GTFOBins exec)
- name: SUID on /usr/bin/python3 — interpreter = full root shell (GTFOBins exec)
  ansible.builtin.command:
    cmd: chmod 4755 /usr/bin/python3

- name: ssh password auth on
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: restart sshd

- name: sshd_config.d drop-in wins over cloud-image defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-pentrain-password.conf
    content: "PasswordAuthentication yes\n"
    mode: "0644"
  notify: restart sshd
