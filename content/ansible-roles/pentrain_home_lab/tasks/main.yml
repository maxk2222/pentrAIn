---
# pentrain_home_lab — home-lab LAN assessment helpers on the Kali VM.
#
# Attached via topology.kali.roles by the home-lab quests: drops the report
# skeleton the command flag greps against and makes sure the assessment
# toolchain is present (the WAN uplink means apt works, but offline kits
# shouldn't miss a beat either).
- name: assessment toolchain
  ansible.builtin.apt:
    name:
      - nmap
      - nbtscan
      - arp-scan
      - smbclient
      - snmp
      - dnsutils
      - python3-pip
      - enum4linux        # SMB/NAS user+share+policy enumeration
      - nfs-common        # showmount + read-only NFS mounts
      - avahi-utils       # mDNS browse — phones/TVs/casters don't answer nmap
      - cups-ipp-utils    # ipptool for printer attribute reads
      - mosquitto-clients # open MQTT brokers on IoT gear
      - hydra             # own devices only — ROE-gated in the briefing
      - netcat-openbsd
      - curl
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  failed_when: false   # some names drift between kali releases — never brick deploy

- name: evidence drop dir
  ansible.builtin.file:
    path: /home/kali/evidence
    state: directory
    owner: kali
    group: kali
    mode: "0755"

- name: report skeleton (flag checks structure, not this template)
  ansible.builtin.copy:
    dest: /home/kali/lan-report-template.md
    mode: "0644"
    owner: kali
    group: kali
    content: |
      # LAN Assessment Report
      # copy me to lan-report.md and fill every section — the grader greps for it

      ## Scope
      authorized network: <CIDR>   assessment date: <YYYY-MM-DD>

      ## Hosts discovered
      | IP | MAC / vendor | hostname | open ports / services |
      |----|--------------|----------|-----------------------|

      ## Device access
      what each probe actually reached — anonymous shares, file listings,
      configs/banners, or "closed, nothing answered" (that counts too).
      | host | device class | probe | result (evidence in ~/evidence/) |
      |------|--------------|-------|---------------------------------|

      ## Findings
      | severity | host:port | finding | recommendation |
      |----------|-----------|---------|----------------|

      ## Summary
      devices in scope: <n>   findings: <n>   top risks: <one line>
