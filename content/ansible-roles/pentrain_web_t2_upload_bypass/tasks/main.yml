---
# web-t2-upload-bypass "Gallery" — naive extension blacklist (.php blocked,
# .phtml/.phar not) + client-controlled MIME check → webshell as www-data.
# Privesc: a group-writable healthcheck script runs as root via a systemd
# timer every minute. Flags are injected post-deploy.

- name: install services
  ansible.builtin.apt:
    name: [apache2, libapache2-mod-php, openssh-server, curl]
    state: present
    update_cache: true

- name: deploy the gallery app
  ansible.builtin.copy:
    src: gallery/
    dest: /var/www/html
    owner: www-data
    group: www-data
    mode: preserve

- name: remove the stock placeholder page
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

- name: uploads dir — www-data writable, autoindexed
  ansible.builtin.file:
    path: /var/www/html/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: php also executes .phtml/.phar — the bypass the blacklist misses
  ansible.builtin.copy:
    dest: /etc/apache2/conf-available/pentrain-upload.conf
    content: |
      <FilesMatch ".+\.ph(p[3457]?|tml|ar)$">
          SetHandler application/x-httpd-php
      </FilesMatch>
    mode: "0644"
  notify: restart apache2

- name: enable the conf
  ansible.builtin.command: a2enconf pentrain-upload
  changed_when: false
  notify: restart apache2

- name: internal flag dir — reachable only from a shell context
  ansible.builtin.file:
    path: /var/www/internal
    state: directory
    owner: root
    group: www-data
    mode: "0750"

- name: webapp dir
  ansible.builtin.file:
    path: /opt/webapp
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: healthcheck script — group-writable, executes as root
  ansible.builtin.copy:
    dest: /opt/webapp/healthcheck.sh
    content: |
      #!/bin/bash
      # PixelVault health check — runs via systemd timer, DO NOT break
      curl -fsS -o /dev/null http://localhost/ || systemctl restart apache2
    mode: "0775"
    owner: root
    group: www-data

- name: healthcheck systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [webapp-health.service, webapp-health.timer]
  notify: reload systemd

- name: enable + start the healthcheck timer
  ansible.builtin.systemd:
    name: webapp-health.timer
    enabled: true
    state: started
    daemon_reload: true
