---
# wifi-t2-exam — live exam: AP "ops-wifi" (WPA2), chatty client, and an
# encrypted config backup that only the cracked PSK opens.
# Requires pentrain_wifi_lab first (roles list order in quest.yaml).
- name: hostapd config — ops-wifi WPA2 on wlan0
  ansible.builtin.copy:
    dest: /etc/hostapd/lab.conf
    content: |
      interface=wlan0
      driver=nl80211
      ssid=ops-wifi
      hw_mode=g
      channel=1
      wpa=2
      wpa_passphrase=corporate-wifi
      wpa_key_mgmt=WPA-PSK
      rsn_pairwise=CCMP
    mode: "0600"

- name: client profile
  ansible.builtin.copy:
    dest: /etc/wpa_supplicant/lab-client.conf
    content: |
      network={
          ssid="ops-wifi"
          psk="corporate-wifi"
          scan_ssid=1
      }
    mode: "0600"

- name: systemd unit — AP + client
  ansible.builtin.copy:
    dest: /etc/systemd/system/pentrain-wifi-ap.service
    content: |
      [Unit]
      Description=PenTrAIn ops-wifi exam AP + client
      After=pentrain-hwsim.service
      Requires=pentrain-hwsim.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'ip link set wlan0 up; ip link set wlan2 up'
      ExecStart=/usr/sbin/hostapd -B /etc/hostapd/lab.conf
      ExecStart=/sbin/wpa_supplicant -B -i wlan2 -c /etc/wpa_supplicant/lab-client.conf
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: enable + start exam AP
  ansible.builtin.systemd:
    name: pentrain-wifi-ap
    enabled: true
    state: started
    daemon_reload: true

- name: wifi-admin account — password is the ops-wifi passphrase
  ansible.builtin.user:
    name: wifi-admin
    shell: /bin/bash
    password: "{{ 'corporate-wifi' | password_hash('sha512') }}"
  no_log: true

- name: flag dir
  ansible.builtin.file:
    path: /home/wifi-admin
    state: directory
    owner: wifi-admin
    mode: "0755"

- name: plain backup payload (encrypts to backup.enc below)
  ansible.builtin.copy:
    dest: /opt/wifi/backup-plain.txt
    content: "backup-key: BACKUP-KEY-7741\nrotation: quarterly\n"
    mode: "0600"

- name: encrypted config backup — PSK is the decryption key
  ansible.builtin.command:
    cmd: openssl enc -aes-256-cbc -pbkdf2 -in /opt/wifi/backup-plain.txt -out /opt/wifi/backup.enc -k corporate-wifi
  args:
    creates: /opt/wifi/backup.enc

- name: drop the plaintext after encrypting
  ansible.builtin.file:
    path: /opt/wifi/backup-plain.txt
    state: absent
