---
# DVWA container on a docker host. Flags are injected post-deploy by the
# backend via guest-agent + docker exec (see backend flags service).
- name: pull DVWA image
  ansible.builtin.command: docker pull vulnerables/web-dvwa:latest
  register: pull
  changed_when: "'Downloaded newer' in pull.stdout or 'Status: Downloaded' in pull.stdout"

- name: run DVWA container
  ansible.builtin.command: >-
    docker run -d --name dvwa --restart unless-stopped
    -p 80:80 vulnerables/web-dvwa:latest
  register: ctr
  changed_when: ctr.rc == 0
  failed_when: ctr.rc != 0 and 'Conflict' not in (ctr.stderr | default(''))

# DVWA ships unconfigured — until /setup.php's "Create / Reset Database" is
# clicked the login page 500s. Do the click for the trainee.
- name: wait for dvwa http
  ansible.builtin.uri:
    url: http://127.0.0.1/setup.php
    status_code: 200
  register: dvwa_up
  retries: 30
  delay: 3
  until: dvwa_up.status == 200

- name: initialize the dvwa database
  ansible.builtin.shell: |
    set -e
    curl -s -c /tmp/dvwa_ck -o /tmp/dvwa_setup.html http://127.0.0.1/setup.php
    TOKEN=$(sed -n "s/.*user_token' value='\([a-f0-9A-F]*\)'.*/\1/p" /tmp/dvwa_setup.html | head -1)
    [ -z "$TOKEN" ] && exit 0   # token layout changed — app still runs, login may work anyway
    curl -s -b /tmp/dvwa_ck -o /dev/null \
      -d "create_db=Create+%2F+Reset+Database&security_level=low&user_token=$TOKEN" \
      http://127.0.0.1/setup.php
  args:
    executable: /bin/sh
  changed_when: true

- name: flag staging dir inside container (backend fills per-session)
  ansible.builtin.command: docker exec dvwa mkdir -p /flags
  ignore_errors: true
