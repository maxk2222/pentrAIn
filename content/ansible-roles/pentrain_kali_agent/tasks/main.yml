---
# pentrAIn kali agent: shell telemetry + coach tmux channel + qemu guest agent.
- name: ensure qemu-guest-agent present and running
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: enable qemu-guest-agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started

# pentest helpers the coach/trainee expects to exist — the lab has no
# internet at runtime, so everything must land at deploy time
- name: install pentest helper packages
  ansible.builtin.apt:
    name:
      - sshpass
      - expect
      - proxychains4
      - sshuttle
      - python3-pexpect
      - mariadb-client   # mysql client for db-enum quests
      - gobuster
    state: present
  when: ansible_os_family == "Debian"
  failed_when: false   # package names drift; never brick the deploy for them

- name: install pentrain dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/pentrain
    - /etc/pentrain
    - /var/spool/pentrain

# telemetry log dir must be writable by every lab user (the shell hook appends
# per-user cmd-$USER.log) — sticky world-writable like /tmp, so no one can
# clobber another user's log.
- name: install telemetry log dir (world-writable, sticky)
  ansible.builtin.file:
    path: /var/log/pentrain
    state: directory
    mode: "1777"

- name: install telemetried
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: telemetried.py, dest: /opt/pentrain/telemetried.py, mode: "0755" }
    - { src: hook.sh, dest: /etc/pentrain/hook.sh, mode: "0644" }
    - { src: pentrain-telemetried.service, dest: /etc/systemd/system/pentrain-telemetried.service, mode: "0644" }

- name: default telemetried config (overwritten by backend at deploy)
  ansible.builtin.copy:
    dest: /etc/pentrain/telemetried.conf
    content: "TOKEN=\nSESSION=\nAPI=http://pentrain-app:8000\n"
    mode: "0640"

- name: source telemetry hook in bash
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: "[ -f /etc/pentrain/hook.sh ] && . /etc/pentrain/hook.sh"
    create: true

- name: source telemetry hook in zsh (kali default shell)
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    line: "[ -f /etc/pentrain/hook.sh ] && source /etc/pentrain/hook.sh"
    create: true
  ignore_errors: true

- name: enable + start telemetried
  ansible.builtin.systemd:
    name: pentrain-telemetried
    daemon_reload: true
    enabled: true
    state: started

- name: ensure tmux installed (coach takeover channel)
  ansible.builtin.apt:
    name:
      - tmux
      - sshpass
    state: present

- name: core pentest tooling (must exist — every quest assumes these)
  ansible.builtin.apt:
    name:
      - nmap
      - gobuster
      - sqlmap
      - hydra
      - john
      - hashcat
      - nikto
      - smbclient
      - enum4linux-ng
      - netcat-openbsd
      - proxychains4
      - sshuttle
      - ffuf
      - seclists
      - wordlists
      - impacket-scripts
      - evil-winrm
      # seclists is ~3-4 GB — intentional: every wordlist a quest hints at exists
    state: present
    update_cache: true

- name: nice-to-have tooling (package names vary by kali release — best effort)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - netexec           # crackmapexec successor (NXC)
    - crackmapexec      # older releases still carry this name
    - chisel            # tcp/udp tunnel — pivot fallback
    - bloodhound.py     # AD collection (cli: bloodhound-python)
    - responder         # LLMNR/NBT-NS poisoning for AD quests
    - kerberoast        # GetUserSPNs alternative bundle
    - metasploit-framework  # big, but trainees expect it
  ignore_errors: true

- name: unzip rockyou if only the compressed list exists
  ansible.builtin.command:
    cmd: gzip -dk /usr/share/wordlists/rockyou.txt.gz
    creates: /usr/share/wordlists/rockyou.txt
  ignore_errors: true

- name: rockyou present?
  ansible.builtin.stat:
    path: /usr/share/wordlists/rockyou.txt
  register: _rockyou

- name: warn when wordlists landed without rockyou
  ansible.builtin.debug:
    msg: "WARNING: rockyou.txt missing — password attacks in quests will stall"
  when: not _rockyou.stat.exists

- name: autostart coach tmux on desktop login (visible agent actions)
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/pentrain-coach.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=pentrAIn Coach Terminal
      # coach execs run as root via qemu-agent → attach to root's session
      Exec=xfce4-terminal --title="pentrain-coach" -e "sudo tmux attach -t pentrain-coach 2>/dev/null || sudo tmux new-session -s pentrain-coach"
      X-GNOME-Autostart-enabled=true
    mode: "0644"

- name: pentrain motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: |
      pentrAIn attack box — telemetry active.
      Your AI coach observes commands and may act in the 'pentrain-coach' tmux session.
