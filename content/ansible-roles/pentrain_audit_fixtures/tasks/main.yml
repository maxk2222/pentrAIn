---
- name: audit fixture directories
  ansible.builtin.file:
    path: "/opt/pentrain-audit/{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ audit_files }}"

- name: install selected audit fixtures
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/pentrain-audit/{{ item }}"
    mode: "0644"
  loop: "{{ audit_files }}"

- name: report directory
  ansible.builtin.file:
    path: /tmp/pentrain-audit-reports
    state: directory
    mode: "1777"
