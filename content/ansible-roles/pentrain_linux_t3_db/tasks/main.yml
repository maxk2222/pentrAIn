---
# Linux T3 (pivot) — db tier: only reachable via the web host (.21).
# dbadm/Summer creds leak from the web tier's config.ini.
- name: create dbadm user (sudo group — root flag needs it)
  ansible.builtin.user:
    name: dbadm
    password: "{{ 'PivotOn24!' | password_hash('sha512') }}"
    shell: /bin/bash
    home: /home/dbadm
    create_home: true
    groups: sudo
    append: true

# NOPASSWD so `ssh -J … dbadm@db01 "sudo cat /root/db.txt"` works without a
# tty on the pivot channel
- name: dbadm full sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/dbadm
    content: "dbadm ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: install mariadb
  ansible.builtin.apt:
    name: [mariadb-server, iptables-persistent]
    state: present
    update_cache: true

- name: compute web host (same subnet, .21)
  ansible.builtin.set_fact:
    pentrain_web_host: >-
      {{ ansible_default_ipv4.address.split('.')[0:3] | join('.') }}.21

- name: restrict ssh to the web host only (forces the pivot)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    source: "{{ pentrain_web_host }}"
    jump: ACCEPT
  when: ansible_default_ipv4.address is defined

- name: keep established sessions alive (ansible provisioning + pivots)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    ctstate: ESTABLISHED
    jump: ACCEPT

- name: drop other ssh attempts from the range net
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: DROP

- name: persist firewall rules
  ansible.builtin.command: netfilter-persistent save
  ignore_errors: true

- name: enable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication yes"
  notify: restart sshd

- name: sshd_config.d drop-in wins over cloud-image defaults
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-pentrain-password.conf
    content: "PasswordAuthentication yes\n"
    mode: "0644"
  notify: restart sshd
