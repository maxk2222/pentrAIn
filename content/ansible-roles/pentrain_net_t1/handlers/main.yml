---
- name: restart vsftpd
  ansible.builtin.service:
    name: vsftpd
    state: restarted

- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted

- name: restart redis
  ansible.builtin.service:
    name: redis-server
    state: restarted
