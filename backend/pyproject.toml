[project]
name = "pentrain-backend"
version = "0.1.0"
description = "pentrAIn platform backend — quests, sessions, scoring, console proxy, telemetry"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13",
    "PyYAML>=6.0.2",
    "itsdangerous>=2.2",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "BLE", "SIM", "RUF", "FURB"]
# E501: line length enforced by editor, B008: Depends()/Field() in defaults is
# the FastAPI idiom, UP042: str,Enum mixins are the SQLAlchemy-idiomatic pattern,
# BLE001: top-level loops deliberately swallow all exceptions (ws/reconnect),
# RUF002/RUF003: em-dashes/prose in strings are intentional
ignore = ["E501", "B008", "UP042", "BLE001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
