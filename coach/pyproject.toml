[project]
name = "pentrain-coach"
version = "0.1.0"
description = "pentrAIn coaching agent — observes trainees, adapts hints, can drive the Kali box"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "websockets>=13",
    "structlog>=24.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# BLE001: the coach loop deliberately swallows all exceptions to stay attached
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
